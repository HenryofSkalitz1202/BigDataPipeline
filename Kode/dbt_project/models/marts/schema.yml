version: 2

sources:
  - name: raw
    database: iceberg
    schema: raw
    tables:
      - name: customer
      - name: orders
      - name: lineitem

models:
  - name: mart_customer_revenue
    description: "Data Mart showing total orders and total revenue per customer."
    columns:
      - name: customer_key
        description: "Primary key of the data mart (Customer ID)"
        tests:
          - unique
          - not_null